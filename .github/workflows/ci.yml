name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Evaluation regression gate
        run: pytest -q tests/test_evaluation.py

  docker-sandbox-integration:
    if: ${{ vars.AGENTICOS_TEST_SANDBOX_IMAGE != '' }}
    runs-on: ubuntu-latest
    env:
      AGENTICOS_TEST_SANDBOX_IMAGE: ${{ vars.AGENTICOS_TEST_SANDBOX_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Docker daemon
        run: docker info
      - name: Preload administrator-approved digest-pinned image
        run: docker pull "$AGENTICOS_TEST_SANDBOX_IMAGE"
      - name: Run real Docker sandbox integration tests
        env:
          AGENTICOS_DOCKER_INTEGRATION: "1"
        run: pytest -q tests/test_docker_sandbox_integration.py
